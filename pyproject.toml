[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldrecon"
version = "0.1.0"
description = "Field notes and a small toolkit for locating and classifying anti-bot shields in mobile apps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
shieldrecon = "shieldrecon.cli:main"

[tool.setuptools]
packages = ["shieldrecon"]
